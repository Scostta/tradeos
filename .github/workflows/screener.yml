name: Invest screener

# Run mensual del screener (INVEST_SPEC.md §3). El cron cae los días 1–4 y el
# script solo trabaja el primer día hábil NYSE del mes; el resto sale sin hacer
# nada. workflow_dispatch corre siempre (--force), por defecto sobre el último
# día hábil del mes anterior.
on:
  schedule:
    - cron: "0 7 1-4 * *"
  workflow_dispatch:
    inputs:
      run_date:
        description: "Cierre mensual a evaluar (YYYY-MM-DD, último día hábil de un mes). Vacío = mes anterior."
        required: false
        default: ""

concurrency:
  group: invest-screener
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: scripts/screener
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/screener/requirements.txt

      - run: pip install -r requirements.txt

      - name: Run screener
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          JOB_VERSION: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
          RUN_DATE: ${{ inputs.run_date }}
          # Avisos push (§4.10): sin el secret, el job no avisa.
          INVEST_NOTIFY_URL: https://tradeos-gold.vercel.app/api/invest/notify
          INVEST_NOTIFY_SECRET: ${{ secrets.INVEST_NOTIFY_SECRET }}
        run: |
          args=()
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then args+=(--force); fi
          if [ -n "$RUN_DATE" ]; then args+=(--run-date "$RUN_DATE"); fi
          python -m screener "${args[@]}"

      # Si el run aborta (no_data > 5 %) o falla, aviso push con el enlace a este run.
      - name: Notify failure
        if: failure()
        env:
          INVEST_NOTIFY_SECRET: ${{ secrets.INVEST_NOTIFY_SECRET }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$INVEST_NOTIFY_SECRET" ]; then echo "sin INVEST_NOTIFY_SECRET: sin aviso"; exit 0; fi
          curl -sS --max-time 30 -X POST https://tradeos-gold.vercel.app/api/invest/notify \
            -H "Authorization: Bearer $INVEST_NOTIFY_SECRET" -H "Content-Type: application/json" \
            -d "{\"event\":\"failure\",\"runUrl\":\"$RUN_URL\"}" || true
