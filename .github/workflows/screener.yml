name: Invest screener

# Run mensual del screener (INVEST_SPEC.md §3). El cron cae los días 1–4 y el
# script solo trabaja el primer día hábil NYSE del mes; el resto sale sin hacer
# nada. workflow_dispatch corre siempre (--force), por defecto sobre el último
# día hábil del mes anterior.
on:
  schedule:
    - cron: "0 7 1-4 * *"
  workflow_dispatch:
    inputs:
      run_date:
        description: "Cierre mensual a evaluar (YYYY-MM-DD, último día hábil de un mes). Vacío = mes anterior."
        required: false
        default: ""

concurrency:
  group: invest-screener
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: scripts/screener
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/screener/requirements.txt

      - run: pip install -r requirements.txt

      - name: Run screener
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          JOB_VERSION: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
          RUN_DATE: ${{ inputs.run_date }}
        run: |
          args=()
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then args+=(--force); fi
          if [ -n "$RUN_DATE" ]; then args+=(--run-date "$RUN_DATE"); fi
          python -m screener "${args[@]}"
